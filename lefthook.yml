pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,md}'
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,js,jsx}'
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    - name: typecheck
      run: bun run typecheck

pre-push:
  parallel: true
  commands:
    deadcode:
      run: bun run knip
    test:
      run: bun run test
