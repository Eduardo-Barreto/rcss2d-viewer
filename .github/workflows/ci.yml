name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default: nothing here comments, pushes or publishes, so no job needs more.
# Actions are pinned to a commit SHA with the version in a trailing comment: a tag like `v4`
# is mutable, so whoever owns the action can repoint it at code nobody reviewed. Bump the SHA
# and the comment together.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: bun run policy diffs against the merge-base with the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      # -f github turns findings into inline PR annotations, which is why there is no
      # reviewdog step in this workflow.
      - run: bun run lint -- -f github
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run knip
      - run: bun run test
      # `tsc -b` above catches type errors, this catches the rest of a broken bundle: an
      # import that resolves in the editor but not in the build, an asset Vite can't find.
      # The build is part of the gate, so a broken bundle fails here and not on deploy.
      - run: bun run build
      - run: bun run policy
      # Scoped to what ships (`--prod`) and reported rather than enforced. Every advisory this
      # repo has ever had came from a dev CLI's transitive tree, which never reaches a browser
      # and can't be fixed here. Read it, don't be blocked by it. Caveat: `bun audit` silently
      # ignores unknown flags, so if a future bun drops `--prod` this quietly widens back to
      # the full tree. Harmless while the step can't fail.
      - run: bun audit --audit-level=high --prod
        continue-on-error: true

  semgrep:
    runs-on: ubuntu-latest
    # The official image ships the engine and its Python runtime, so this job needs no
    # setup step. semgrep-action is deprecated; the container is the supported path.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config p/react --config p/typescript --error --skip-unknown-extensions

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
