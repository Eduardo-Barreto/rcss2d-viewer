name: PR title

# The PR title names the change in the merge commit and in the history of main, so it follows
# the same convention as every commit. Its own workflow so that editing the title reruns only
# this check and not the whole CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      # Through env, never `${{ }}` inside `run`: the title is text anyone can write, and an
      # inline expression would paste it into the shell script.
      - run: bun scripts/commit-msg.ts --title "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
